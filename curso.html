<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso — Innova Social 5.0</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --blue:#62ABE2; --blue-deep:#2279BA; --blue-dark:#154B73; --night:#0B1F2C; --night2:#122A38;
    --ink:#132330; --muted:#4F697A; --paper:#fff; --paper2:#F2F8FB; --line:#E2ECF1; --mint:#82CA76;
    --ok:#2F9E6B; --side-w:360px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--paper2); color:var(--ink); font-family:"Nunito",-apple-system,"Segoe UI",sans-serif; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  button{ font:inherit; cursor:pointer; }

  .topbar{ background:rgba(255,255,255,.94); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); color:var(--ink); position:sticky; top:0; z-index:50; }
  .topbar .row{ max-width:100%; margin:0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand{ font-weight:800; font-size:14.5px; display:flex; align-items:center; gap:10px; color:var(--ink); min-width:0; }
  .brand .mark{ width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--mint)); color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:min(48vw,420px); color:var(--ink); }
  .top-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .top-actions a, .top-actions button{
    font-size:13px; font-weight:700; color:var(--ink); background:#fff;
    border:1.5px solid var(--line); border-radius:10px; padding:7px 12px;
  }
  .top-actions a:hover, .top-actions button:hover{ border-color:var(--blue); color:var(--blue-deep); }
  .top-prog{ display:none; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--muted); }
  .top-prog .bar{ width:90px; height:5px; background:var(--paper2); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .top-prog .bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--mint)); width:0; }
  @media (min-width:720px){ .top-prog{ display:flex; } }

  .preview{ display:none; background:#FFF6E0; border-bottom:1px solid #F2DDA6; color:#7A5A12; font-size:13px; font-weight:700; text-align:center; padding:9px 16px; }
  .preview.on{ display:block; }

  .shell{ display:grid; grid-template-columns:minmax(0,1fr) var(--side-w); min-height:calc(100vh - 53px); }
  @media (max-width:980px){ .shell{ grid-template-columns:1fr; } }

  .stage{ background:var(--paper2); color:var(--ink); display:flex; flex-direction:column; min-width:0; }
  .player-wrap{ background:#111; position:relative; border-bottom:1px solid var(--line); }
  .player{
    position:relative; width:100%; aspect-ratio:16/9; max-height:min(62vh,720px); background:#111; margin:0 auto;
  }
  .player iframe, .player video{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .player .placeholder{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:linear-gradient(160deg,#E8F3F9,#F2F8FB); color:var(--ink); text-align:center; padding:24px;
  }
  .player .placeholder .ico{
    width:72px; height:72px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--blue-deep); box-shadow:0 10px 24px -16px rgba(19,35,48,.35);
  }
  .player .placeholder h2{ margin:0; font-size:20px; font-weight:800; }
  .player .placeholder p{ margin:0; font-size:14px; color:var(--muted); max-width:36ch; line-height:1.5; }
  .player .doc-card{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:linear-gradient(160deg,#F7FBFD,#EEF5F9); padding:28px; text-align:center; color:var(--ink);
  }
  .player .doc-card .badge{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-deep); }
  .player .doc-card h2{ margin:0; font-size:clamp(20px,3vw,28px); max-width:20ch; }
  .player .doc-card p{ margin:0; color:var(--muted); font-size:14.5px; max-width:42ch; line-height:1.55; }
  .btn-open{
    display:inline-flex; align-items:center; gap:8px; background:var(--blue-deep); color:#fff; font-weight:800; font-size:14px;
    border:0; border-radius:12px; padding:12px 18px; text-decoration:none;
  }
  .btn-open:hover{ background:var(--blue-dark); }

  .lesson-bar{
    padding:18px 22px 22px; border-bottom:1px solid var(--line); background:#fff;
  }
  .lesson-bar .kicker{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-deep); margin:0 0 6px; }
  .lesson-bar h1{ font-size:clamp(18px,2.4vw,24px); margin:0 0 8px; letter-spacing:-.02em; font-weight:800; color:var(--ink); }
  .lesson-bar p{ margin:0 0 14px; color:var(--muted); font-size:14px; line-height:1.55; max-width:70ch; }
  .lesson-actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .lesson-actions button, .lesson-actions a{
    border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
    padding:9px 14px; font-size:13px; font-weight:700;
  }
  .lesson-actions button:hover, .lesson-actions a:hover{ border-color:var(--blue); color:var(--blue-deep); }
  .lesson-actions .primary{ background:var(--blue-deep); color:#fff; border-color:var(--blue-deep); }
  .lesson-actions .primary:hover{ background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }
  .lesson-actions .primary.done{ background:#EEF8EC; color:#2F6E26; border-color:#CFE8C9; }

  .about{
    padding:22px 20px 40px; background:var(--paper2); color:var(--ink); flex:1;
  }
  .about-card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 22px; max-width:820px; }
  .about-card h2{ font-size:16px; margin:0 0 8px; }
  .about-card p{ margin:0; color:var(--muted); font-size:14.5px; line-height:1.6; }
  .about-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .about-meta span{
    font-size:12px; font-weight:800; color:var(--blue-deep); background:var(--paper2); border:1px solid var(--line);
    border-radius:999px; padding:6px 10px;
  }

  .sidebar{
    background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0;
    max-height:calc(100vh - 53px); position:sticky; top:53px;
  }
  @media (max-width:980px){
    .sidebar{ position:relative; top:auto; max-height:none; border-left:0; border-top:1px solid var(--line); }
  }
  .side-head{ padding:14px 16px; border-bottom:1px solid var(--line); background:#fff; }
  .side-head h2{ font-size:14.5px; margin:0 0 4px; letter-spacing:-.01em; }
  .side-head .sub{ font-size:12.5px; color:var(--muted); font-weight:700; }
  .side-head .prog{ margin-top:10px; height:6px; background:var(--paper2); border-radius:99px; overflow:hidden; }
  .side-head .prog i{ display:block; height:100%; background:linear-gradient(90deg,var(--blue),var(--mint)); width:0; transition:width .35s; }

  .curriculum{ overflow:auto; flex:1; }
  .mod{ border-bottom:1px solid var(--line); }
  .mod-h{
    width:100%; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; text-align:left;
    background:var(--paper2); border:0; padding:14px 16px; font-weight:800; font-size:13.5px; color:var(--ink);
  }
  .mod-h:hover{ background:#e8f2f8; }
  .mod-h .left{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .mod-h .left small{ font-size:11.5px; font-weight:700; color:var(--muted); }
  .mod-h .chev{ transition:transform .2s; color:var(--muted); flex-shrink:0; margin-top:2px; }
  .mod.open .mod-h .chev{ transform:rotate(180deg); }
  .mod-body{ display:none; }
  .mod.open .mod-body{ display:block; }

  .lec{
    width:100%; display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:center;
    padding:11px 14px 11px 16px; border:0; border-top:1px solid var(--line); background:#fff; text-align:left; color:var(--ink);
  }
  .lec:hover{ background:#f7fbfd; }
  .lec.on{ background:color-mix(in srgb, var(--blue) 10%, #fff); box-shadow:inset 3px 0 0 var(--blue-deep); }
  .lec .check{
    width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    background:#fff; color:transparent; flex-shrink:0;
  }
  .lec.done .check{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .lec .nm{ font-size:13px; font-weight:700; line-height:1.35; }
  .lec .tp{ font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .lec .ic{ color:var(--muted); display:flex; }

  .vacio{
    margin:40px auto; max-width:480px; background:#fff; color:var(--muted); border-radius:16px; padding:36px 24px;
    text-align:center; border:1px dashed var(--line);
  }
  .vacio b{ display:block; color:var(--ink); font-size:17px; margin-bottom:6px; }
  .vacio a{ color:var(--blue-deep); font-weight:800; }

  .mobile-toggle{
    display:none; position:fixed; right:16px; bottom:16px; z-index:60; border:0; border-radius:999px;
    background:var(--blue-deep); color:#fff; font-weight:800; font-size:13px; padding:12px 16px;
    box-shadow:0 12px 28px rgba(15,50,80,.4);
  }
  @media (max-width:980px){
    .mobile-toggle{ display:inline-flex; align-items:center; gap:8px; }
    .sidebar{ display:none; }
    .sidebar.open{ display:flex; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="row">
    <a class="brand" href="mis-cursos.html">
      <span class="mark">IS</span>
      <span class="title" id="topTitle">Curso</span>
    </a>
    <div class="top-actions">
      <div class="top-prog"><span id="topPct">0%</span><span class="bar"><i id="topBar"></i></span></div>
      <a id="volver" href="mis-cursos.html">← Mis cursos</a>
    </div>
  </div>
</header>
<div class="preview" id="previewBar">Vista previa: así verá el curso un beneficiario. <span id="previewEstado"></span></div>
<div id="root"><div class="vacio" style="margin-top:80px;"><b>Cargando curso…</b></div></div>
<button type="button" class="mobile-toggle" id="togSide" hidden>Contenido del curso</button>

<script>
(function(){
  'use strict';
  const cfg = window.INNOVA_SUPABASE || {};
  const root = document.getElementById('root');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const https = (u) => { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : null; } catch (e) { return null; } };
  function ytId(u){ const m = String(u || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/); return m ? m[1] : null; }
  const TIPOS = { youtube:'Video', video:'Video', documento:'Documento', enlace:'Enlace', plantilla:'Plantilla', otro:'Recurso' };
  const ICON = {
    youtube:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>',
    video:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>',
    documento:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    enlace:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>',
    plantilla:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
    otro:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>'
  };

  if (!window.supabase || !cfg.url) { root.innerHTML = '<div class="vacio"><b>Sin conexión</b>No pudimos conectar con la plataforma.</div>'; return; }
  const sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const preview = params.get('preview') === '1';
  const progKey = 'innova_curso_prog_' + id;
  function loadProg(){ try { return JSON.parse(localStorage.getItem(progKey) || '{}'); } catch (e) { return {}; } }
  function saveProg(p){ try { localStorage.setItem(progKey, JSON.stringify(p)); } catch (e) {} }

  let curso = null, lecciones = [], grupos = [], actual = null, prog = {};

  function pct(){
    if (!lecciones.length) return 0;
    const done = lecciones.filter(l => prog[l.id]).length;
    return Math.round((done / lecciones.length) * 100);
  }
  function updateProgUI(){
    const p = pct();
    const topPct = document.getElementById('topPct');
    const topBar = document.getElementById('topBar');
    const sidePct = document.getElementById('sidePct');
    const sideBar = document.getElementById('sideBar');
    if (topPct) topPct.textContent = p + '%';
    if (topBar) topBar.style.width = p + '%';
    if (sidePct) sidePct.textContent = p + '% completado · ' + lecciones.filter(l => prog[l.id]).length + '/' + lecciones.length;
    if (sideBar) sideBar.style.width = p + '%';
    [...document.querySelectorAll('.lec')].forEach(el => {
      const lid = el.getAttribute('data-id');
      el.classList.toggle('done', !!prog[lid]);
    });
    const markBtn = document.getElementById('markBtn');
    if (markBtn && actual) {
      const done = !!prog[actual.id];
      markBtn.classList.toggle('done', done);
      markBtn.textContent = done ? '✓ Completada' : 'Marcar como completada';
    }
  }

  function playerHtml(r){
    if (!r) {
      return '<div class="placeholder"><div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>'
        + '<h2>Elige una lección</h2><p>Selecciona un video o material del contenido del curso para empezar.</p></div>';
    }
    const url = https(r.url);
    const yid = r.tipo === 'youtube' ? ytId(r.url) : null;
    if (yid) return '<iframe src="https://www.youtube-nocookie.com/embed/' + yid + '?rel=0&modestbranding=1" title="' + esc(r.titulo) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
    if (r.tipo === 'video' && url) return '<video controls autoplay preload="metadata" src="' + esc(url) + '"></video>';
    const label = r.tipo === 'enlace' ? 'Abrir enlace' : ('Abrir ' + (r.archivo_nombre || TIPOS[r.tipo] || 'archivo'));
    return '<div class="doc-card"><span class="badge">' + esc(TIPOS[r.tipo] || 'Recurso') + '</span>'
      + '<h2>' + esc(r.titulo) + '</h2>'
      + (r.descripcion ? '<p>' + esc(r.descripcion) + '</p>' : '<p>Abre este material en una pestaña nueva para revisarlo.</p>')
      + (url ? '<a class="btn-open" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(label) + ' ↗</a>' : '<p>Este recurso no tiene un enlace disponible.</p>')
      + '</div>';
  }

  function selectLesson(rid, opts){
    const r = lecciones.find(x => x.id === rid);
    if (!r) return;
    actual = r;
    const player = document.getElementById('player');
    const kicker = document.getElementById('lessonKicker');
    const title = document.getElementById('lessonTitle');
    const desc = document.getElementById('lessonDesc');
    if (player) player.innerHTML = playerHtml(r);
    if (kicker) kicker.textContent = (r.modulo || 'Materiales') + ' · ' + (TIPOS[r.tipo] || 'Recurso');
    if (title) title.textContent = r.titulo;
    if (desc) {
      desc.style.display = r.descripcion ? '' : 'none';
      desc.textContent = r.descripcion || '';
    }
    [...document.querySelectorAll('.lec')].forEach(el => el.classList.toggle('on', el.getAttribute('data-id') === r.id));
    updateProgUI();
    if (opts && opts.scrollMobile && window.matchMedia('(max-width:980px)').matches) {
      document.getElementById('playerWrap')?.scrollIntoView({ behavior:'smooth', block:'start' });
      document.getElementById('sidebar')?.classList.remove('open');
    }
    try { history.replaceState(null, '', 'curso.html?id=' + encodeURIComponent(id) + (preview ? '&preview=1' : '') + '&l=' + encodeURIComponent(r.id)); } catch (e) {}
  }

  function nextLesson(){
    if (!actual) return;
    const i = lecciones.findIndex(l => l.id === actual.id);
    if (i >= 0 && i < lecciones.length - 1) selectLesson(lecciones[i + 1].id, { scrollMobile:true });
  }
  function prevLesson(){
    if (!actual) return;
    const i = lecciones.findIndex(l => l.id === actual.id);
    if (i > 0) selectLesson(lecciones[i - 1].id, { scrollMobile:true });
  }
  function toggleDone(){
    if (!actual) return;
    prog[actual.id] = !prog[actual.id];
    saveProg(prog);
    updateProgUI();
  }

  function renderShell(){
    const portada = https(curso.portada_url);
    document.getElementById('topTitle').textContent = curso.titulo;
    document.title = curso.titulo + ' — Innova Social 5.0';

    root.innerHTML = '<div class="shell">'
      + '<div class="stage">'
      +   '<div class="player-wrap" id="playerWrap"><div class="player" id="player">' + playerHtml(null) + '</div></div>'
      +   '<div class="lesson-bar">'
      +     '<p class="kicker" id="lessonKicker">Contenido del curso</p>'
      +     '<h1 id="lessonTitle">' + esc(curso.titulo) + '</h1>'
      +     '<p id="lessonDesc">' + esc(curso.descripcion || 'Selecciona una lección en el panel de contenido para comenzar.') + '</p>'
      +     '<div class="lesson-actions">'
      +       '<button type="button" id="prevBtn">← Anterior</button>'
      +       '<button type="button" id="nextBtn">Siguiente →</button>'
      +       '<button type="button" class="primary" id="markBtn">Marcar como completada</button>'
      +     '</div>'
      +   '</div>'
      +   '<div class="about"><div class="about-card">'
      +     '<h2>Sobre este curso</h2>'
      +     '<p>' + esc(curso.descripcion || 'Materiales formativos del programa Innova Social.') + '</p>'
      +     '<div class="about-meta">'
      +       (curso.categoria ? '<span>' + esc(curso.categoria) + '</span>' : '')
      +       '<span>' + lecciones.length + (lecciones.length === 1 ? ' lección' : ' lecciones') + '</span>'
      +       '<span>' + grupos.length + (grupos.length === 1 ? ' módulo' : ' módulos') + '</span>'
      +     '</div>'
      +   '</div></div>'
      + '</div>'
      + '<aside class="sidebar" id="sidebar">'
      +   '<div class="side-head">'
      +     '<h2>Contenido del curso</h2>'
      +     '<div class="sub" id="sidePct">0% completado</div>'
      +     '<div class="prog"><i id="sideBar"></i></div>'
      +   '</div>'
      +   '<div class="curriculum">' + (grupos.length ? grupos.map((g, gi) => {
        const nDone = g.items.filter(it => prog[it.id]).length;
        return '<div class="mod open" data-mod="' + gi + '">'
          + '<button type="button" class="mod-h"><span class="left"><span>' + esc(g.k) + '</span><small>' + nDone + '/' + g.items.length + ' · ' + g.items.length + (g.items.length === 1 ? ' lección' : ' lecciones') + '</small></span>'
          + '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>'
          + '<div class="mod-body">' + g.items.map(r => {
            return '<button type="button" class="lec' + (prog[r.id] ? ' done' : '') + '" data-id="' + esc(r.id) + '">'
              + '<span class="check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span>'
              + '<span><div class="nm">' + esc(r.titulo) + '</div><div class="tp">' + esc(TIPOS[r.tipo] || 'Recurso') + '</div></span>'
              + '<span class="ic">' + (ICON[r.tipo] || ICON.otro) + '</span></button>';
          }).join('') + '</div></div>';
      }).join('') : '<div class="vacio" style="margin:20px;border:0;"><b>Sin materiales</b>Este curso todavía no tiene lecciones.</div>')
      +   '</div>'
      + '</aside></div>';

    document.getElementById('prevBtn').addEventListener('click', prevLesson);
    document.getElementById('nextBtn').addEventListener('click', nextLesson);
    document.getElementById('markBtn').addEventListener('click', toggleDone);
    document.querySelectorAll('.mod-h').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.mod').classList.toggle('open'));
    });
    document.querySelectorAll('.lec').forEach(btn => {
      btn.addEventListener('click', () => selectLesson(btn.getAttribute('data-id'), { scrollMobile:true }));
    });

    const tog = document.getElementById('togSide');
    tog.hidden = false;
    tog.onclick = () => {
      const side = document.getElementById('sidebar');
      side.classList.toggle('open');
      tog.textContent = side.classList.contains('open') ? 'Ocultar contenido' : 'Contenido del curso';
    };

    const want = params.get('l');
    const start = (want && lecciones.find(l => l.id === want)) || lecciones[0];
    if (start) selectLesson(start.id);
    else updateProgUI();
  }

  (async function(){
    if (!id) { root.innerHTML = '<div class="vacio"><b>Falta el curso</b><a href="mis-cursos.html">Ver mis cursos</a></div>'; return; }
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { location.replace('acceso.html'); return; }
    if (preview) {
      document.getElementById('previewBar').classList.add('on');
      document.getElementById('volver').href = 'admin.html';
      document.getElementById('volver').textContent = '← Volver al panel';
    }
    const { data: c, error } = await sb.from('cursos').select('*').eq('id', id).maybeSingle();
    if (error || !c) { root.innerHTML = '<div class="vacio"><b>Curso no disponible</b>Este curso no existe o no está disponible para tu cuenta.</div>'; return; }
    if (preview) document.getElementById('previewEstado').textContent = c.activo ? '(Publicado)' : '(Aún no publicado: los beneficiarios todavía no lo ven)';
    if (!preview && !c.activo) { root.innerHTML = '<div class="vacio"><b>Curso no disponible</b>Este curso todavía no está publicado.</div>'; return; }
    curso = c;
    prog = loadProg();
    const { data: recs } = await sb.from('recursos').select('*').eq('curso_id', id).eq('activo', true).order('orden').order('created_at');
    lecciones = recs || [];
    grupos = [];
    lecciones.forEach(r => {
      const k = (r.modulo || '').trim() || 'Materiales del curso';
      let g = grupos.find(x => x.k === k);
      if (!g) { g = { k, items: [] }; grupos.push(g); }
      g.items.push(r);
    });
    renderShell();
  })();
})();
</script>
</body>
</html>
